name: Deploy Snake 2.0 Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild application ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat Snake-2.0-V2.2.5-SPCK.zip.part-* > Snake-2.0-V2.2.5-SPCK.zip
          rm -rf dist
          mkdir -p dist
          unzip -q Snake-2.0-V2.2.5-SPCK.zip -d dist
          test -f dist/index.html
          test -f dist/game.js
          test -f dist/manifest.webmanifest
          test -f dist/sw.js

      - name: Apply verified runtime and installation corrections
        shell: bash
        run: |
          set -euo pipefail
          cp deploy/snake2-stats.js dist/snake2-stats.js
          cp deploy/install-gate-fixed.js dist/install-gate-v225.js
          python3 deploy/patch-game.py
          python3 deploy/patch-head-sway.py

          # The installed app must always land on its home screen.
          # Remove the post-install autostart parameter and neutralize the old
          # helper that automatically clicked the "Jouer" button.
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('dist/install-gate-v225.js')
          text = path.read_text(encoding='utf-8')

          text = re.sub(
              r"\n\s*launchUrl\.searchParams\.set\('autostart',\s*'1'\);",
              '',
              text
          )

          start = text.find('  function autoStartInstalledGame() {')
          end = text.find('\n  if (\'serviceWorker\' in navigator)', start)
          if start < 0 or end < 0:
              raise SystemExit('autoStartInstalledGame block missing')

          replacement = """  function autoStartInstalledGame() {
            const params = new URLSearchParams(location.search);
            if (!params.has('autostart') && !params.has('source') && !params.has('t')) return;
            const clean = new URL(location.href);
            ['autostart','source','t'].forEach(key => clean.searchParams.delete(key));
            history.replaceState(null, '', clean.href);
          }
          """
          text = text[:start] + replacement + text[end:]

          path.write_text(text, encoding='utf-8')
          PY

          # Gameplay checks
          grep -q 'catchUpSteps < 5' dist/game.js
          grep -q 'bodySpineGradient' dist/game.js
          grep -q 'points.length > 18 ? 2' dist/game.js
          grep -A4 -B2 'state.levelComplete = true; state.running = false;' dist/game.js | grep -q 'window.snake2TrackGameStart'

          # Realistic head sway checks: visual only, no gameplay/hitbox changes.
          grep -q 'const headSwayPhase = time \* 0.0185' dist/game.js
          grep -q 'const visualHeadX = head.x + swayNormalX \* headSwayPx' dist/game.js
          grep -q 'const visualHeadY = head.y + swayNormalY \* headSwayPx' dist/game.js
          grep -q 'headImg, visualHeadX, visualHeadY, headAngle' dist/game.js
          grep -q 'ctx.translate(visualHeadX, visualHeadY)' dist/game.js

          # Installation confirmation and persistence checks
          grep -q "window.addEventListener('appinstalled'" dist/install-gate-v225.js
          grep -q "const INSTALL_CONFIRM_KEY = 'snake2_install_confirmed_v4'" dist/install-gate-v225.js
          grep -q 'localStorage.setItem(INSTALL_CONFIRM_KEY' dist/install-gate-v225.js
          grep -q 'localStorage.removeItem(INSTALL_CONFIRM_KEY)' dist/install-gate-v225.js
          grep -q 'installCompleted: persistedInstallConfirmedAt > 0' dist/install-gate-v225.js
          grep -q 'installConfirmedAt: persistedInstallConfirmedAt' dist/install-gate-v225.js
          grep -q 'Installation terminée' dist/install-gate-v225.js
          grep -q 'Rafraîchir et ouvrir l’application' dist/install-gate-v225.js

          # Post-install action must be a real user link for PWA navigation capture.
          grep -q "button = document.createElement('a')" dist/install-gate-v225.js
          grep -q "button.target = '_blank'" dist/install-gate-v225.js
          grep -q "button.href = launchUrl.href" dist/install-gate-v225.js
          grep -q 'navigationInProgress: false' dist/install-gate-v225.js
          grep -q "window.addEventListener('pagehide'" dist/install-gate-v225.js
          ! grep -q 'window.location.assign(launchUrl.href)' dist/install-gate-v225.js
          ! grep -q "window.open(launchUrl.href, '_blank'" dist/install-gate-v225.js
          ! grep -q "clean.searchParams.set('refresh'" dist/install-gate-v225.js

          # Home-screen launch checks: never auto-start a game after installation.
          ! grep -q "launchUrl.searchParams.set('autostart', '1')" dist/install-gate-v225.js
          ! grep -q 'play.click()' dist/install-gate-v225.js
          grep -q "history.replaceState(null, '', clean.href)" dist/install-gate-v225.js

          # Version/cache checks force devices off the broken install flow.
          grep -q "serviceWorker.register('./sw.js?v=2.2.6-install8'" dist/install-gate-v225.js
          grep -q 'install-gate-v225.js?v=2.2.6-install8' dist/index.html
          grep -q 'snake-2.0-v2.2.6-install-truth-20260812-v8' dist/sw.js

          # Explicitly forbid previous reload-loop mechanisms.
          ! grep -q 'controllerchange' dist/install-gate-v225.js
          ! grep -q 'hardRefreshAfterInstall' dist/install-gate-v225.js

          # Cache and manifest checks
          grep -q 'networkFirstCritical' dist/sw.js
          grep -q 'isInstallGate' dist/sw.js
          grep -q 'manifest.webmanifest' dist/index.html

          python3 - <<'PY'
          import json, re
          from pathlib import Path
          manifest = json.loads(Path('dist/manifest.webmanifest').read_text(encoding='utf-8'))
          assert manifest.get('name') or manifest.get('short_name')
          assert manifest.get('start_url')
          assert manifest.get('display') in {'fullscreen','standalone','minimal-ui','window-controls-overlay'}
          sizes = {icon.get('sizes') for icon in manifest.get('icons', [])}
          assert '192x192' in sizes and '512x512' in sizes
          assert manifest.get('launch_handler', {}).get('client_mode')
          sw = Path('dist/sw.js').read_text(encoding='utf-8')
          core = re.search(r'const CORE_ASSETS = \[(.*?)\];', sw, re.S)
          assert core
          assets = re.findall(r"'([^']+)'", core.group(1))
          missing = []
          for asset in assets:
              rel = asset[2:] if asset.startswith('./') else asset
              if not Path('dist', rel).exists(): missing.append(rel)
          assert not missing, f'Missing service worker assets: {missing}'
          PY

          node --check dist/install-gate-v225.js
          node --check dist/sw.js
          node --check dist/game.js
          grep -q 'game.js?v=2.2.5-perf1' dist/index.html
          grep -q 'snake2-stats.js?v=20260812h' dist/index.html
          grep -q 'snake2-public-stats' dist/snake2-stats.js
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
