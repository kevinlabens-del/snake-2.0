name: Deploy Snake 2.0 Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild application ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat Snake-2.0-V2.2.5-SPCK.zip.part-* > Snake-2.0-V2.2.5-SPCK.zip
          rm -rf dist
          mkdir -p dist
          unzip -q Snake-2.0-V2.2.5-SPCK.zip -d dist
          test -f dist/index.html
          test -f dist/game.js
          test -f dist/apple-snake-levels.js
          test -f dist/manifest.webmanifest
          test -f dist/sw.js

      - name: Apply verified runtime and installation corrections
        shell: bash
        run: |
          set -euo pipefail
          cp deploy/snake2-stats.js dist/snake2-stats.js
          cp deploy/install-gate-fixed.js dist/install-gate-v225.js
          python3 deploy/patch-game.py
          python3 deploy/patch-head-sway.py
          python3 deploy/patch-missed-apples.py

          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('dist/install-gate-v225.js')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r"\n\s*launchUrl\.searchParams\.set\('autostart',\s*'1'\);", '', text)
          start = text.find('  function autoStartInstalledGame() {')
          end = text.find('\n  if (\'serviceWorker\' in navigator)', start)
          if start < 0 or end < 0:
              raise SystemExit('autoStartInstalledGame block missing')
          replacement = """  function autoStartInstalledGame() {
            const params = new URLSearchParams(location.search);
            if (!params.has('autostart') && !params.has('source') && !params.has('t')) return;
            const clean = new URL(location.href);
            ['autostart','source','t'].forEach(key => clean.searchParams.delete(key));
            history.replaceState(null, '', clean.href);
          }
          """
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

          grep -q 'catchUpSteps < 5' dist/game.js
          grep -q 'bodySpineGradient' dist/game.js
          grep -A4 -B2 'state.levelComplete = true; state.running = false;' dist/game.js | grep -q 'window.snake2TrackGameStart'

          # Timed accuracy missions now consume lives instead of ending while lives remain.
          grep -q "const timedAccuracy = state.mission?.missionType === 'accuracy'" dist/game.js
          grep -q "levelEngine?.record('lifeLost', { amount: 1 })" dist/game.js
          grep -q 'Pomme manquée' dist/game.js
          grep -q "mission.missionType === 'accuracy'" dist/apple-snake-levels.js
          grep -q 'const allowedMisses = Math.max(0' dist/apple-snake-levels.js
          grep -q 'pomme.*manquée.*max' dist/apple-snake-levels.js

          # Natural visual head sweep remains independent from gameplay logic.
          grep -q 'const headSweepPhase = time \* 0.0025132741' dist/game.js
          grep -q 'const headSweep = Math.sin(headSweepPhase)' dist/game.js
          grep -q 'const headSweepPx = cell \* 0.22 \* headSweep' dist/game.js
          grep -q 'const headAngle = baseHeadAngle + headSweep \* 0.30' dist/game.js
          grep -q 'headImg, visualHeadX, visualHeadY, headAngle' dist/game.js
          grep -q 'ctx.translate(visualHeadX, visualHeadY)' dist/game.js
          ! grep -q 'const forwardArcPx = cell \* 0.10' dist/game.js
          ! grep -q 'const headSweepPx = cell \* 0.62' dist/game.js

          # Preserve previous render-performance protections.
          grep -q 'Math.ceil(Math.max(1, points.length - 2) / 13)' dist/game.js
          grep -q 'if (points.length <= 48)' dist/game.js

          # Installed Android browser flow attempts one automatic handoff, with a guarded refresh fallback.
          grep -q "window.addEventListener('appinstalled'" dist/install-gate-v225.js
          grep -q "const INSTALL_CONFIRM_KEY = 'snake2_install_confirmed_v4'" dist/install-gate-v225.js
          grep -q 'localStorage.setItem(INSTALL_CONFIRM_KEY' dist/install-gate-v225.js
          grep -q 'localStorage.removeItem(INSTALL_CONFIRM_KEY)' dist/install-gate-v225.js
          grep -q 'Installation terminée' dist/install-gate-v225.js
          grep -q 'Rafraîchir et ouvrir l’application' dist/install-gate-v225.js
          grep -q "button = document.createElement('a')" dist/install-gate-v225.js
          grep -q "const AUTO_LAUNCH_GUARD_KEY = 'snake2_auto_launch_guard_v1'" dist/install-gate-v225.js
          grep -q 'function scheduleAutomaticRefreshAndLaunch' dist/install-gate-v225.js
          grep -q "scheduleAutomaticRefreshAndLaunch('install', 450)" dist/install-gate-v225.js
          grep -q "scheduleAutomaticRefreshAndLaunch('browser', 1200)" dist/install-gate-v225.js
          grep -q 'navigator.getInstalledRelatedApps' dist/install-gate-v225.js
          grep -q 'launchLink.click()' dist/install-gate-v225.js
          grep -q 'location.replace(refreshUrl.href)' dist/install-gate-v225.js
          ! grep -q 'window.location.assign(launchUrl.href)' dist/install-gate-v225.js
          ! grep -q "window.open(launchUrl.href, '_blank'" dist/install-gate-v225.js
          ! grep -q "launchUrl.searchParams.set('autostart', '1')" dist/install-gate-v225.js
          ! grep -q 'play.click()' dist/install-gate-v225.js

          # Force installed devices and browsers to receive corrected gameplay logic.
          grep -q "serviceWorker.register('./sw.js?v=2.2.6-install12'" dist/install-gate-v225.js
          grep -q 'install-gate-v225.js?v=2.2.6-install12' dist/index.html
          grep -q 'game.js?v=2.2.5-missedlife1' dist/index.html
          grep -q 'apple-snake-levels.js?v=2.2.5-missedlife1' dist/index.html
          grep -q 'snake-2.0-v2.2.6-auto-app-launch-20260814-v14' dist/sw.js

          grep -q 'networkFirstCritical' dist/sw.js
          grep -q 'isInstallGate' dist/sw.js
          grep -q 'manifest.webmanifest' dist/index.html

          node --check dist/install-gate-v225.js
          node --check dist/sw.js
          node --check dist/game.js
          node --check dist/apple-snake-levels.js
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('./dist/manifest.webmanifest', 'utf8'));
          const selfApp = manifest.related_applications?.find(app => app.platform === 'webapp');
          if (!selfApp || selfApp.url !== './manifest.webmanifest') {
            throw new Error('The installed PWA cannot be detected from the browser');
          }
          if (manifest.prefer_related_applications !== false) {
            throw new Error('The web app must remain the preferred installation target');
          }
          NODE
          node - <<'NODE'
          const Levels = require('./dist/apple-snake-levels.js');
          const mission = Levels.getMission(15, {}, { adaptive: true });
          const missFail = mission.failConditions.find(c => c.metric === 'apples.missed');
          if (!missFail || Number(missFail.value) < 1) throw new Error('Level 15 still fails on the first missed apple');
          if (!String(mission.description).includes('manquée')) throw new Error('Accuracy rule is not visible in mission description');
          NODE
          grep -q 'snake2-stats.js?v=20260812h' dist/index.html
          grep -q 'snake2-public-stats' dist/snake2-stats.js
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
