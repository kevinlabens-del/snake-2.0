name: Deploy Snake 2.0 Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild application ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat Snake-2.0-V2.2.5-SPCK.zip.part-* > Snake-2.0-V2.2.5-SPCK.zip
          rm -rf dist
          mkdir -p dist
          unzip -q Snake-2.0-V2.2.5-SPCK.zip -d dist
          test -f dist/index.html
          test -f dist/game.js

      - name: Apply verified runtime corrections
        shell: bash
        run: |
          set -euo pipefail
          cp deploy/snake2-stats.js dist/snake2-stats.js
          python3 deploy/patch-game.py
          grep -q 'catchUpSteps < 5' dist/game.js
          grep -q 'bodySpineGradient' dist/game.js
          grep -q 'points.length > 18 ? 2' dist/game.js
          grep -A4 -B2 'state.levelComplete = true; state.running = false;' dist/game.js | grep -q 'window.snake2TrackGameStart'
          grep -q 'game.js?v=2.2.5-perf1' dist/index.html
          grep -q 'snake2-stats.js?v=20260812h' dist/index.html
          grep -q 'perf-realtime-20260812h' dist/sw.js
          grep -q 'snake2-public-stats' dist/snake2-stats.js
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
