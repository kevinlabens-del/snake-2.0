name: Deploy Snake 2.0 Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild application ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat Snake-2.0-V2.2.5-SPCK.zip.part-* > Snake-2.0-V2.2.5-SPCK.zip
          rm -rf dist
          mkdir -p dist
          unzip -q Snake-2.0-V2.2.5-SPCK.zip -d dist
          test -f dist/index.html
          test -f dist/game.js

      - name: Install stable realtime stats and fixed-timestep gameplay
        shell: bash
        run: |
          set -euo pipefail
          cp deploy/snake2-stats.js dist/snake2-stats.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          game = Path('dist/game.js')
          js = game.read_text(encoding='utf-8')

          # Statistics: one public "partie" = one successfully completed level.
          js = js.replace("    save.gamesPlayed++;\n    window.snake2TrackGameStart?.();", "    save.gamesPlayed++;")
          needle = "    state.levelComplete = true; state.running = false;\n    recordMissionOutcome(true, snapshot);"
          hook = "    state.levelComplete = true; state.running = false;\n    window.snake2TrackGameStart?.();\n    recordMissionOutcome(true, snapshot);"
          if 'state.levelComplete = true; state.running = false;\n    window.snake2TrackGameStart?.();' not in js:
              if needle not in js: raise SystemExit('completeLevel hook point missing')
              js = js.replace(needle, hook, 1)

          # Performance: movement must not depend on rendering FPS.
          old_loop = """      state.acc += dt * 1000;
      const dynamicStep = missionDynamicStep();
      state.visualStepMs = dynamicStep;
      if (state.acc >= dynamicStep) {
        state.acc -= dynamicStep;
        step();
      }"""
          new_loop = """      state.acc += dt * 1000;
      let dynamicStep = missionDynamicStep();
      state.visualStepMs = dynamicStep;
      let catchUpSteps = 0;
      while (state.running && state.acc >= dynamicStep && catchUpSteps < 5) {
        state.acc -= dynamicStep;
        step();
        catchUpSteps++;
        dynamicStep = missionDynamicStep();
        state.visualStepMs = dynamicStep;
      }
      // Prevent a long frame from creating an endless catch-up spiral.
      if (catchUpSteps >= 5) state.acc = Math.min(state.acc, dynamicStep);"""
          if old_loop not in js: raise SystemExit('game loop point missing')
          js = js.replace(old_loop, new_loop, 1)

          # Reduce GPU cost as the snake grows; the continuous spine underneath keeps it visually solid.
          js = js.replace("const detailStride = points.length > 120 ? 3 : points.length > 58 ? 2 : 1;",
                          "const detailStride = points.length > 72 ? 4 : points.length > 36 ? 3 : points.length > 18 ? 2 : 1;")

          # Reuse the fixed body gradient instead of allocating a new CanvasGradient every rendered frame.
          js = js.replace("  const wavePointBuffer = [];", "  const wavePointBuffer = [];\n  let bodySpineGradient = null;")
          old_grad = """    const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    grad.addColorStop(0, '#080a0b');
    grad.addColorStop(.40, '#30363a');
    grad.addColorStop(.62, '#0b0e10');
    grad.addColorStop(1, '#020304');
    ctx.shadowBlur = 0;
    ctx.strokeStyle = grad;"""
          new_grad = """    if (!bodySpineGradient) {
      bodySpineGradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      bodySpineGradient.addColorStop(0, '#080a0b');
      bodySpineGradient.addColorStop(.40, '#30363a');
      bodySpineGradient.addColorStop(.62, '#0b0e10');
      bodySpineGradient.addColorStop(1, '#020304');
    }
    ctx.shadowBlur = 0;
    ctx.strokeStyle = bodySpineGradient;"""
          if old_grad not in js: raise SystemExit('body gradient point missing')
          js = js.replace(old_grad, new_grad, 1)

          game.write_text(js, encoding='utf-8')

          index = Path('dist/index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(r'<script src="https://cdn\.jsdelivr\.net/npm/@supabase/supabase-js@2"></script>\s*', '', html)
          html = re.sub(r'<script src="\./snake2-stats\.js(?:\?v=[^"]*)?" defer></script>\s*', '', html)
          html = re.sub(r'game\.js\?v=2\.2\.5(?:-stats\d+|-perf\d+)?', 'game.js?v=2.2.5-perf1', html)
          scripts = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n  <script src="./snake2-stats.js?v=20260812h" defer></script>'
          pos = html.lower().rfind('</body>')
          html = html[:pos] + '  ' + scripts + '\n' + html[pos:] if pos >= 0 else html + '\n' + scripts
          index.write_text(html, encoding='utf-8')

          sw = Path('dist/sw.js')
          if sw.exists():
              text = sw.read_text(encoding='utf-8')
              text = re.sub(r"const CACHE = 'snake-2\.0-v2\.2\.5[^']*';", "const CACHE = 'snake-2.0-v2.2.5-perf-realtime-20260812h';", text, count=1)
              if "'./snake2-stats.js'" not in text:
                  text = text.replace("const CORE_ASSETS = [", "const CORE_ASSETS = [\n  './snake2-stats.js',")
              sw.write_text(text, encoding='utf-8')
          PY

          grep -q 'catchUpSteps < 5' dist/game.js
          grep -q 'bodySpineGradient' dist/game.js
          grep -q 'points.length > 18 ? 2' dist/game.js
          grep -A4 -B2 'state.levelComplete = true; state.running = false;' dist/game.js | grep -q 'window.snake2TrackGameStart'
          grep -q 'game.js?v=2.2.5-perf1' dist/index.html
          grep -q 'snake2-stats.js?v=20260812h' dist/index.html
          grep -q 'perf-realtime-20260812h' dist/sw.js
          grep -q 'snake2-public-stats' dist/snake2-stats.js
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
